# Имя вашего workflow, которое будет отображаться в интерфейсе GitHub Actions
name: API tests

# Указываем, когда будет запускаться данный workflow
on:
  push:
    branches:
      - main  # Запускать workflow, когда будет сделан коммит в ветку main
  pull_request:
    branches:
      - main  # Запускать workflow, когда будет сделан pull request в ветку main

# Определяем все шаги, которые должны быть выполнены в рамках работы с тестами
jobs:
  # ДЖОБА 1: Запуск автотестов
  run-tests:
    runs-on: ubuntu-latest  # Указываем, что тесты будут запускаться на последней версии Ubuntu

    steps:
      # 1. Шаг, который будет клонировать ваш репозиторий на машину GitHub Actions
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Шаг для установки Python на виртуальной машине
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Устанавливаем версию Python 3.11

      # 3. Шаг для клонирования репозитория с тестовым сервером в рабочую среду
      - name: Clone test server repository
        run: git clone https://github.com/Nikita-Filonov/qa-automation-engineer-api-course.git

      # 4. Шаг для установки зависимостей для тестового сервера
      - name: Install test server dependencies
        run: pip install -r qa-automation-engineer-api-course/requirements.txt

      # 5. Шаг для запуска тестового сервера с необходимыми переменными окружения
      - name: Start a test server
        env:
          APP_HOST: "http://localhost:8000"
          DATABASE_URL: "sqlite+aiosqlite:///./local.db"
          JWT_ALGORITHM: "HS256"
          JWT_SECRET_KEY: "qa-automation-engineer-api-course-secret-key"
          JWT_ACCESS_TOKEN_EXPIRE: 1800
          JWT_REFRESH_TOKEN_EXPIRE: 5184000
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 --app-dir ./qa-automation-engineer-api-course &

      # 6. Шаг для установки всех зависимостей проекта
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 7. Шаг для запуска тестов с использованием pytest и генерации отчётов Allure
      - name: Run API tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2

      # 8. Шаг для сохранения результатов тестов (allure-results) как артефакта
      - name: Upload allure-results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 30  # Хранить артефакты 30 дней

  # ДЖОБА 2: Публикация отчета на GitHub Pages
  publish-report:
    runs-on: ubuntu-latest
    needs: run-tests  # Эта джоба запускается только после успешного выполнения run-tests
    if: always()  # Выполняется всегда, даже если run-tests завершилась с ошибкой
    permissions:
      contents: write  # Разрешаем запись в репозиторий для публикации на GitHub Pages

    steps:
      # 1. Шаг для клонирования репозитория (нужен для получения истории отчетов)
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages  # Получаем ветку gh-pages для истории отчетов
          path: gh-pages  # Сохраняем в директорию gh-pages

      # 2. Шаг для загрузки артефакта с результатами тестов
      - name: Download allure-results artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results  # Сохраняем в директорию allure-results

      # 3. Шаг для генерации и отображения отчёта Allure с историей
      - name: Generate Allure Report with history
        uses: simple-elf/allure-report-action@v1.12
        with:
          allure_results: allure-results  # Каталог с результатами тестов
          allure_history: allure-history  # Каталог для истории отчётов Allure

      # 4. Шаг для публикации отчёта на GitHub Pages
      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
